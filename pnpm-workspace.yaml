packages:
  - "apps/*"
  - "infra"

# Only these packages may run install scripts (native binaries and the git hook installer).
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true

overrides:
  # @astrojs/check's WASM runtime otherwise resolves to a broken 2.0 beta. Drop once upstream is fixed.
  "@emnapi/core": ^1.11.3
  "@emnapi/runtime": ^1.11.3
